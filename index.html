<style>
:root{
  --bg:#F7F5F0;--bg-soft:#EFECE4;--paper:#FFFFFF;--paper-2:#FAFAF7;
  --t1:#18181B;--t2:#52525B;--t3:#A1A1AA;--t4:#D4D4D8;
  --border:#E7E4DC;--border-lt:#EFECE4;--border-str:#DCD8CC;
  --sidebar:#141414;--sidebar-hover:rgba(255,255,255,.06);--sidebar-active:rgba(255,255,255,.10);--sidebar-text:#E4E4E7;--sidebar-muted:rgba(255,255,255,.45);
  --success:#15803D;--success-bg:#EEF7F0;--warning:#A16207;--warning-bg:#FBF3E2;--danger:#B42318;--danger-bg:#FBEDEB;--info:#2B6CB0;--info-bg:#EAF2FA;
  --sh:0 1px 2px rgba(16,16,16,.04),0 1px 3px rgba(16,16,16,.06);
  --sh2:0 2px 4px rgba(16,16,16,.03),0 6px 18px rgba(16,16,16,.07);
  --sh3:0 8px 24px rgba(16,16,16,.10),0 20px 48px rgba(16,16,16,.12);
  --r:10px;--rs:6px;--rl:14px;
  --ff:'Google Sans','DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--ff);background:var(--bg);color:var(--t1);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
input,select,textarea,button{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{font-weight:600;letter-spacing:-.01em}

/* rail */
.rail{position:fixed;left:0;top:0;bottom:0;width:68px;background:var(--sidebar);color:var(--sidebar-text);z-index:50;display:flex;flex-direction:column;padding:18px 12px;transition:width .22s var(--ease);overflow:hidden}
.rail:hover{width:224px;box-shadow:var(--sh3)}
.logo{display:flex;align-items:baseline;gap:6px;padding:4px 8px 22px;white-space:nowrap;cursor:pointer}
.logo b{font-size:20px;font-weight:700;letter-spacing:-.02em;color:#fff}
.logo span{font-size:11px;font-weight:600;letter-spacing:.18em;color:var(--sidebar-muted);opacity:0;transition:opacity .2s}
.rail:hover .logo span{opacity:1}
.nav{display:flex;flex-direction:column;gap:2px}
.ni{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:8px;color:var(--sidebar-muted);white-space:nowrap;border:none;background:none;text-align:left;width:100%;font-size:14px}
.ni i{width:20px;text-align:center;font-size:15px;flex:none}
.ni span{opacity:0;transition:opacity .15s}
.rail:hover .ni span{opacity:1}
.ni:hover{background:var(--sidebar-hover);color:#fff}
.ni.on{background:var(--sidebar-active);color:#fff}
.rail .foot{margin-top:auto;font-size:11px;color:var(--sidebar-muted);white-space:nowrap;padding:0 8px;opacity:0;transition:opacity .2s}
.rail:hover .foot{opacity:1}

.shell{margin-left:68px;min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;background:rgba(247,245,240,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;gap:12px;min-height:64px}
.topbar h1{font-size:20px}
.topbar .sub{color:var(--t3);font-size:13px}
main{padding:24px 28px 80px;max-width:1440px}

/* primitives */
.card{background:var(--paper);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border-str);background:var(--paper);border-radius:8px;padding:7px 13px;font-size:13px;font-weight:500;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--paper-2);border-color:var(--t4)}
.btn.pri{background:var(--t1);border-color:var(--t1);color:#fff}
.btn.pri:hover{background:#000}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;pointer-events:none}

const STOP = new Set('the and for with that this from are will our your you have has was were their they them into over more also all any can its per via who what when where which while about would should could been being than then there these those such only just onto across within without other some most very much many make made need needs want wants using use new project client brief please include including deliver deliverables work'.split(' '));
const toks = t => (String(t || '').toLowerCase().match(/[a-z]{3,}/g) || []).filter(w => !STOP.has(w));
const inModel = () => S.past.filter(p => !p.off && p.total > 0);
function similar(text) {
  const P = inModel(); if (!P.length) return [];
  const docs = P.map(p => toks(p.text + ' ' + p.name)), q = toks(text), N = docs.length + 1, df = {};
  [...docs, q].forEach(d => new Set(d).forEach(w => df[w] = (df[w] || 0) + 1));
  const vec = d => { const tf = {}; d.forEach(w => tf[w] = (tf[w] || 0) + 1); const v = {}; let n = 0; for (const w in tf) { const x = (1 + Math.log(tf[w])) * Math.log(1 + N / df[w]); v[w] = x; n += x * x; } return { v, n: Math.sqrt(n) || 1 }; };
  const qv = vec(q), qd = new Set(detect(text, false).map(d => d.id));

    const pd = new Set(p.detected || []); const inter = [...qd].filter(x => pd.has(x)).length; const uni = new Set([...qd, ...pd]).size || 1;
    return { p, sim: 0.6 * (dot / (qv.n * dv.n)) + 0.4 * (inter / uni) };
  }).sort((a, b) => b.sim - a.sim);
}
function modelCost(picks) {

  for (const pk of picks) { const d = lib(pk.id); if (!d) continue; const f = 1 + (Math.max(1, pk.qty) - 1) * (d.unit || 0); for (const [t, h] of Object.entries(d.tasks)) c += h * f * titleRate(t); }

}

function globalIndex() {

async function pdfLines(file) {

  }

}

  const ppl = Object.entries(byP).sort((a, b) => b[1].c - a[1].c), maxC = Math.max(1, ...ppl.map(r => r[1].c));
  const matches = (s.calib?.matches || []).map(m => ({ ...m, p: S.past.find(p => p.id === m.id) })).filter(m => m.p);
  const sg = s.signals || {};
  return `<div class="card pad"><div class="lbl">Total ex GST</div><div class="big num">${money(t.ex)}</div>
    <div class="kv"><span>Inc GST</span><b class="num">${money(t.inc)}</b></div>
    <div class="kv"><span>Hours</span><b class="num">${hrs(t.hours)}</b></div>
    <div class="kv"><span>Effective rate</span><b class="num">${t.hours ? money(t.ex / t.hours) + '/h' : '—'}</b></div>
    ${sg.budget ? `<div class="note ${t.ex > sg.budget ? 'warn' : 'ok'}">Brief budget ${money(sg.budget)} · ${money(Math.abs(t.ex - sg.budget))} ${t.ex > sg.budget ? 'over' : 'under'}</div>` : ''}
    ${sg.weeks ? `<div class="note">${sg.weeks} weeks in brief · ${hrs(t.hours / sg.weeks)}/week</div>` : ''}</div>
  <div class="card pad"><div class="sec-h"><h3>Phases</h3></div><div class="bars">${s.phases.map((p, i) => `<div class="b"><div class="bt"><span><span class="dot" style="background:${p.color};margin-right:6px"></span>${esc(p.name)}</span><b class="num" style="font-weight:500">${money(t.phasesClient[i])}</b></div><div class="track"><i style="width:${t.sub ? t.phasesClient[i] / t.sub * 100 : 0}%;background:${p.color}"></i></div></div>`).join('')}</div></div>
  <div class="card pad"><div class="sec-h"><h3>Team time</h3></div><div class="bars">${ppl.map(([id, r]) => `<div class="b"><div class="bt"><span>${esc(pLabel(person(id)))}</span><span class="num muted">${hrs(r.h)}</span></div><div class="track"><i style="width:${r.c / maxC * 100}%"></i></div></div>`).join('') || '<p class="hint">No time yet.</p>'}</div></div>
  <div class="card pad"><div class="sec-h"><h3>Pricing model</h3></div>
    ${matches.length || s.calib?.global !== 1 ? `<p class="hint">Calibrated ×${(s.calib?.factor || 1).toFixed(2)}${matches.length ? ` using ${matches.length} similar scope${matches.length > 1 ? 's' : ''}` : ' from overall pricing'}.</p>${matches.map(m => `<div class="kv"><span>${esc(m.p.name)} <span class="faint">${Math.round(m.sim * 100)}%</span></span><b class="num">${money(m.p.total)}</b></div>`).join('')}`
      : `<p class="hint">${inModel().length ? 'No close matches — library defaults used.' : 'Model is empty — library defaults used.'}</p>`}</div>`;
}

function pastModal(p, queue = []) {
  const det = detect(p.text, false).map(d => d.id);
  modal(`
    <div class="hint">${queue.length ? queue.length + ' more after this' : ''}</div>
    <h2>${p._new ? 'Check before adding' : 'Edit past scope'}</h2>
    <p class="hint">${p.file ? esc(p.file) + ' · ' : ''}Correct anything the reader got wrong. Totals are ex GST.</p>
    <div class="row" style="gap:10px;flex-wrap:wrap;margin:14px 0">
      <label class="field grow"><span>Project</span><input class="in" id="pName" value="${esc(p.name)}"></label>
      <label class="field grow"><span>Client</span><input class="in" id="pClient" value="${esc(p.client)}"></label>
      <label class="field" style="width:150px"><span>Total ex GST</span><input class="in num" type="number" id="pTotal" value="${p.total}"></label>
    </div>
    <div class="lbl">Phases</div>
    <table class="tbl" id="pPh" style="margin-top:4px">${p.phases.map(ph => `<tr><td style="padding:4px 0"><input class="in" value="${esc(ph.name)}"></td><td style="width:140px;padding:4px 8px"><input class="in num" type="number" value="${ph.cost}"></td><td style="width:34px;padding:0"><button class="ib del" data-rm><i class="fa-solid fa-xmark"></i></button></td></tr>`).join('')}</table>
    <div class="row" style="margin-top:6px"><button class="btn sm" id="pAddPh"><i class="fa-solid fa-plus"></i>Phase</button><span class="hint grow" id="pSum"></span><button class="btn sm" id="pFit">Use sum as total</button></div>
    <div class="lbl" style="margin-top:14px">Deliverables recognised</div>
    <div class="tags" style="margin-top:6px">${det.map(id => `<span class="tag">${esc(lib(id).name)}${p.itemHours?.[id] ? ' · ' + hrs(p.itemHours[id]) : ''}</span>`).join('') || '<span class="hint">None — add a description below so briefs can match it.</span>'}</div>
    <details style="margin-top:12px"><summary class="hint" style="cursor:pointer">Source text</summary><textarea class="in" id="pText" style="min-height:150px;margin-top:8px">${esc(p.text)}</textarea></details>
    <div class="acts"><button class="btn" data-x="skip">${p._new ? 'Skip' : 'Cancel'}</button><button class="btn pri" data-x="save">${p._new ? 'Add to model' : 'Save'}</button></div>`,
    (m, close) => {
      const tbl = m.querySelector('#pPh');
      const sum = () => { const s = [...tbl.querySelectorAll('tr')].reduce((a, tr) => a + (+tr.querySelectorAll('input')[1].value || 0), 0); m.querySelector('#pSum').textContent = 'Phases add to ' + money(s); return s; };
      const bindRm = () => tbl.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { b.closest('tr').remove(); sum(); });
      bindRm(); sum(); tbl.oninput = sum;
      m.querySelector('#pAddPh').onclick = () => { tbl.insertAdjacentHTML('beforeend', `<tr><td style="padding:4px 0"><input class="in" placeholder="Phase"></td><td style="width:140px;padding:4px 8px"><input class="in num" type="number" value="0"></td><td style="width:34px;padding:0"><button class="ib del" data-rm><i class="fa-solid fa-xmark"></i></button></td></tr>`); bindRm(); };
      m.querySelector('#pFit').onclick = () => m.querySelector('#pTotal').value = Math.round(sum());
      const next = () => { close(); if (queue.length) pastModal(queue[0], queue.slice(1)); else render(); };
      m.querySelector('[data-x=skip]').onclick = next;
      m.querySelector('[data-x=save]').onclick = () => {
        p.name = m.querySelector('#pName').value.trim() || 'Untitled'; p.client = m.querySelector('#pClient').value.trim();
        p.total = +m.querySelector('#pTotal').value || 0; p.text = m.querySelector('#pText').value;
        p.phases = [...tbl.querySelectorAll('tr')].map(tr => { const [a, b] = tr.querySelectorAll('input'); return { name: a.value.trim(), cost: +b.value || 0 }; }).filter(x => x.name);
        p.detected = detect(p.text, false).map(d => d.id);
        const isNew = p._new; delete p._new;
        if (isNew) S.past.push(p); else { const i = S.past.findIndex(x => x.id === p.id); if (i >= 0) S.past[i] = p; }
        save(); toast(isNew ? 'Added to pricing model' : 'Saved'); next();
      };
    });
}

/* ---------------- PDF ---------------- */
function buildPrint(s) {
  const t = totals(s);
  const ref = (s.client || 'BRN').replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase() + '-' + s.id.slice(0, 4).toUpperCase();
  $('#print').innerHTML = `
  <div class="p-head"><div class="ag">${esc(S.settings.agency)}</div><div class="meta"><b>Estimate</b><br>Ref ${ref}<br>${fmtDate(Date.now())}</div></div>
  <div class="p-title">${esc(s.name)}</div><div class="p-client">Prepared for ${esc(s.client || '—')}</div>
  ${s.overview ? `<p class="p-ov">${esc(s.overview)}</p>` : ''}
  <table class="p-tbl"><thead><tr><th>Phase</th><th>Cost</th></tr></thead><tbody>
  ${s.phases.map((p, i) => { const inc = clientItems(p).map(x => x.name + (x.qty > 1 ? ' ×' + x.qty : '')); return `<tr><td><div class="pn">${i + 1}. ${esc(p.name)}</div>${p.desc ? `<div class="pd">${esc(p.desc)}</div>` : ''}${inc.length ? `<div class="pi">Includes: ${esc(inc.join(', '))}</div>` : ''}</td><td class="c">${money(t.phasesClient[i])}</td></tr>`; }).join('')}
  </tbody></table>
  <div class="p-tot">${t.disc ? `<div><span>Subtotal</span><span>${money(t.sub)}</span></div><div><span>Discount</span><span>−${money(t.disc)}</span></div>` : ''}
    <div><span>Total ex GST</span><span>${money(t.ex)}</span></div><div><span>GST ${S.settings.gst}%</span><span>${money(t.gst)}</span></div><div class="g"><span>Total inc GST</span><span>${money(t.inc)}</span></div></div>
  ${s.notes ? `<div class="p-notes"><b>Notes</b>${esc(s.notes)}</div>` : ''}`;
}
function exportPDF() {
  const s = cur(); if (!s) return; buildPrint(s);
  const old = document.title; document.title = `${S.settings.agency} Estimate - ${s.client ? s.client + ' - ' : ''}${s.name}`;
  setTimeout(() => { try { window.print(); } catch (e) { toast('Printing is blocked here'); } document.title = old; }, 100);
}

/* ---------------- actions ---------------- */
const ACT = {
  go: a => go(a.dataset.v),
  open: (a, e) => { if (e.target.closest('button')) return; go('edit', a.dataset.id); },
  dup: a => { const c = JSON.parse(JSON.stringify(S.scopes.find(x => x.id === a.dataset.id))); c.id = uid(); c.name += ' (copy)'; c.status = 'draft'; c.created = c.updated = Date.now(); S.scopes.push(c); save(); render(); toast('Duplicated'); },
  delscope: async a => { if (await confirmBox('Delete this estimate?')) { S.scopes = S.scopes.filter(x => x.id !== a.dataset.id); save(); render(); } },
  scopeit: async () => {
    const d = window._draft; if (!d.brief || d.brief.trim().length < 15) return toast('Add a brief first');
    const done = loader(S.settings.ai ? 'Building estimate with AI…' : 'Building estimate…');
    try { const s = await createScope({ name: d.name.trim(), client: d.client.trim(), brief: d.brief, useAI: S.settings.ai }); S.scopes.push(s); save(); window._draft = null; done(); go('edit', s.id); }
    catch (e) { done(); toast('Something went wrong: ' + e.message); }
  },
  phmove: a => { const s = cur(), i = s.phases.findIndex(p => p.id === a.dataset.pid), j = i + +a.dataset.d; if (j < 0 || j >= s.phases.length) return; [s.phases[i], s.phases[j]] = [s.phases[j], s.phases[i]]; touch(); render(); },
  phdel: async a => { if (await confirmBox('Delete this phase and its lines?')) { const s = cur(); s.phases = s.phases.filter(p => p.id !== a.dataset.pid); touch(); render(); } },
  phregen: a => { const s = cur(), p = findPhase(a.dataset.pid); p.v = (p.v || 0) + 1; p.desc = genPhaseDesc(s, p, p.v); touch(); render(); },
  regenov: () => { const s = cur(); s.overview = genOverview(s); touch(); render(); },
  addphase: () => { const s = cur(); s.phases.push(newPhase('custom', 'New phase', s.phases.length)); touch(); render(); },
  lndel: a => { const p = findPhase(a.dataset.pid), it = findItem(a.dataset.pid, a.dataset.iid); it.lines = it.lines.filter(l => l.id !== a.dataset.lid); if (!it.lines.length) p.items = p.items.filter(i => i !== it); touch(); render(); },
  lnadd: a => { const it = findItem(a.dataset.pid, a.dataset.iid); it.lines.push({ id: uid(), personId: S.people[0]?.id, hours: 1, rate: null }); touch(); render(); },
  rescope: async () => {
    const s = cur(); if (!(await confirmBox('Rebuild the whole table from the brief? Your edits will be replaced.', 'Rebuild'))) return;
    const done = loader('Rebuilding…'); const n = await createScope({ name: s.name, client: s.client, brief: s.brief, useAI: S.settings.ai });
    Object.assign(s, { phases: n.phases, overview: n.overview, calib: n.calib, signals: n.signals, detected: n.detected, aiUsed: n.aiUsed }); touch(); done(); render();
  },
  airewrite: async () => {
    const s = cur(), done = loader('Rewriting copy…');
    try { const r = await aiRewrite(s); if (r.overview) s.overview = r.overview; s.phases.forEach(p => { if (r.phaseDescriptions?.[p.id]) p.desc = r.phaseDescriptions[p.id]; }); toast('Copy rewritten'); }
    catch (e) { s.phases.forEach(p => { p.v = (p.v || 0) + 1; p.desc = genPhaseDesc(s, p, p.v); }); s.overview = genOverview(s); toast('AI not connected — refreshed built-in copy'); }
    done(); touch(); render();
  },
  tomodel: () => {
    const s = cur(), t = totals(s), ih = {};
    s.phases.forEach(p => p.items.forEach(it => { if (it.libId) ih[it.libId] = (ih[it.libId] || 0) + itemHours(it) / (1 + (it.qty - 1) * (lib(it.libId)?.unit || 0)); }));
    const ex = S.past.find(p => p.fromScope === s.id);
    const rec = { id: ex?.id || uid(), fromScope: s.id, name: s.name, client: s.client, date: Date.now(), source: 'estimate', text: s.brief + '\n' + s.phases.map(p => p.name + ': ' + p.items.map(i => i.name).join(', ')).join('\n'), total: Math.round(t.ex), phases: s.phases.map((p, i) => ({ name: p.name, cost: t.phasesClient[i] })), itemHours: ih, detected: [...new Set(s.phases.flatMap(p => p.items.map(i => i.libId)).filter(Boolean))], off: ex?.off || false };
    if (ex) Object.assign(ex, rec); else S.past.push(rec);
    save(); render(); toast(ex ? 'Pricing model updated' : 'Added to pricing model');
  },
  export: exportPDF,
  addpast: () => pastModal({ id: uid(), _new: true, name: '', client: '', date: Date.now(), source: 'manual', text: '', total: 0, phases: [], itemHours: {} }),
  editpast: a => pastModal(JSON.parse(JSON.stringify(S.past.find(p => p.id === a.dataset.id)))),
  delpast: async a => { if (await confirmBox('Remove this scope from the pricing model?', 'Remove')) { S.past = S.past.filter(p => p.id !== a.dataset.id); save(); render(); } },
  addperson: () => { S.people.push({ id: uid(), name: '', title: '', rate: 150 }); save(); render(); },
  delperson: async a => { const used = S.scopes.some(s => s.phases.some(p => p.items.some(i => i.lines.some(l => l.personId === a.dataset.id)))); if (await confirmBox(used ? 'This person is on existing estimates — those lines will show $0 until reassigned. Delete?' : 'Delete this person?')) { S.people = S.people.filter(r => r.id !== a.dataset.id); save(); render(); } },
  addlib: () => { const d = { id: uid(), name: 'New deliverable', phase: 'production', kw: [], tasks: {}, unit: 0 }; S.library.push(d); window._openLib = d.id; save(); render(); },
  dellib: async a => { if (await confirmBox('Remove this deliverable from the library?')) { S.library = S.library.filter(d => d.id !== a.dataset.id); save(); render(); } },
  exportjson: () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' })); a.download = `born-scope-backup-${new Date().toISOString().slice(0, 10)}.json`; a.click(); },
  reset: async () => { if (await confirmBox('Wipe all estimates, the pricing model, rate card and library? Export a backup first.', 'Reset')) { S = seed(); save(); render(); } },
  testai: async () => { const el = $('#aiStatus'); el.textContent = 'Testing…'; try { await callAI('Reply with JSON only.', 'Return {"ok":true}', 50); el.textContent = 'Connected'; } catch (e) { el.textContent = e.message + (S.settings.apiKey ? '' : ' — set ANTHROPIC_API_KEY on the server'); } },
};
document.addEventListener('click', e => { const a = e.target.closest('[data-act]'); if (a && ACT[a.dataset.act]) ACT[a.dataset.act](a, e); });

function setField(el) {
  const [obj, key] = (el.dataset.f || el.dataset.fc).split('.'); const v = el.value;
  const numKeys = ['hours', 'contingency', 'discount', 'gst', 'round', 'pmPct', 'unit'];
  const val = numKeys.includes(key) ? (v === '' ? 0 : +v) : v;
  if (obj === 'scope') { cur()[key] = val; if (key === 'status') el.className = 'pill st-' + v; touch(); return updateTotals(); }
  if (obj === 'phase') { findPhase(el.dataset.pid)[key] = val; if (key === 'override') el.classList.toggle('on', isNum(v)); touch(); return updateTotals(); }
  if (obj === 'item') {
    const it = findItem(el.dataset.pid, el.dataset.iid);
    if (key === 'qty') { const u = lib(it.libId)?.unit ?? 1; const q = Math.max(1, Math.round(+v || 1)); const f0 = 1 + (it.qty - 1) * u, f1 = 1 + (q - 1) * u; it.lines.forEach(l => l.hours = r05(+l.hours * f1 / f0)); it.qty = q; touch(); return render(); }
    it[key] = val; touch(); return;
  }
  if (obj === 'line') { const l = findLine(el.dataset.pid, el.dataset.iid, el.dataset.lid); if (key === 'rate') l.rate = v === '' ? null : +v; else l[key] = val; touch(); if (key === 'personId') return render(); return updateTotals(); }
  if (obj === 'set') { S.settings[key] = val; save(); if (key === 'agency') $('#agencyTag').textContent = v; return; }
  if (obj === 'person') {
    const p = S.people.find(x => x.id === el.dataset.id);
    if (key === 'title') { const old = p.title; p.title = v; if (old && v && !S.people.some(x => x !== p && x.title === old)) S.library.forEach(d => { if (d.tasks[old] != null) { d.tasks[v] = (d.tasks[v] || 0) + d.tasks[old]; delete d.tasks[old]; } }); }
    else p[key] = key === 'rate' ? +v || 0 : v;
    save(); return;
  }
  if (obj === 'lib') {
    const d = S.library.find(x => x.id === el.dataset.id); window._openLib = d.id;
    if (key === 'kw') d.kw = v.split(',').map(x => x.trim().toLowerCase()).filter(Boolean);
    else if (key === 'task') { const h = +v; if (h > 0) d.tasks[el.dataset.title] = h; else delete d.tasks[el.dataset.title]; el.closest('label').classList.toggle('has', h > 0); }
    else d[key] = val;
    save(); if (key === 'phase') render(); return;
  }
}
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.f && !(el.dataset.f === 'person.title')) setField(el);
  if (el.hasAttribute('data-auto')) autosize(el);
  if (el.dataset.draft) { window._draft[el.dataset.draft] = el.value; if (el.dataset.draft === 'brief') { clearTimeout(window._lc); window._lc = setTimeout(liveChips, 300); } }
  if (el.hasAttribute('data-search')) { window._q = el.value; const pos = el.selectionStart; render(); const n = $('[data-search]'); n.focus(); n.setSelectionRange(pos, pos); }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.fc || el.dataset.f === 'person.title') setField(el);
  if (el.dataset.pasttog) { const p = S.past.find(x => x.id === el.dataset.pasttog); p.off = !el.checked; save(); render(); toast(p.off ? 'Excluded from learning' : 'Included in learning'); }
  if (el.dataset.chg === 'additem') {
    const p = findPhase(el.dataset.pid), v = el.value; if (!v) return; let it;
    if (v === '__custom') it = { id: uid(), libId: null, name: 'Custom line', qty: 1, lines: [{ id: uid(), personId: S.people[0]?.id, hours: 4, rate: null }] };
    else if (v === '__pm') it = pmItem(phaseHours(p) * (+S.settings.pmPct || 10) / 100);
    else it = itemFromLib(lib(v), 1, cur().calib?.factor || 1);
    p.items.push(it); touch(); render();
  }
  if (el.hasAttribute('data-aitog')) { S.settings.ai = el.checked; save(); }
  if (el.hasAttribute('data-briefup') && el.files[0]) {
    try { const txt = await fileText(el.files[0]); window._draft.brief = (window._draft.brief ? window._draft.brief + '\n\n' : '') + txt.trim(); if (!window._draft.name) window._draft.name = el.files[0].name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' '); render(); toast('Brief loaded'); }
    catch (err) { toast('Could not read that file'); }
  }
  if (el.hasAttribute('data-pastup')) handlePast([...el.files]);
  if (el.hasAttribute('data-importjson') && el.files[0]) {
    try { const d = migrate(JSON.parse(await el.files[0].text())); if (!d.people || !d.scopes) throw 0; S = d; save(); render(); toast('Backup imported'); } catch (err) { toast('Not a valid backup'); }
  }
});
async function handlePast(files) {
  if (!files.length) return;
  const done = loader('Reading scopes…'), out = [];
  for (const f of files) { try { const p = await importFile(f); p._new = true; out.push(p); } catch (e) { toast('Couldn\'t read ' + f.name); } }
  done(); if (out.length) pastModal(out[0], out.slice(1));
}
document.addEventListener('dragover', e => { const d = e.target.closest?.('#drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest?.('#drop'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', e => { const d = e.target.closest?.('#drop'); if (d) { e.preventDefault(); d.classList.remove('over'); handlePast([...e.dataTransfer.files]); } });

render();
</script>
