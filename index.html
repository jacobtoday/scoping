<style>
:root{
  --bg:#F7F5F0;--bg-soft:#EFECE4;--paper:#FFFFFF;--paper-2:#FAFAF7;
  --t1:#18181B;--t2:#52525B;--t3:#A1A1AA;--t4:#D4D4D8;
  --border:#E7E4DC;--border-lt:#EFECE4;--border-str:#DCD8CC;
  --sidebar:#141414;--sidebar-hover:rgba(255,255,255,.06);--sidebar-active:rgba(255,255,255,.10);--sidebar-text:#E4E4E7;--sidebar-muted:rgba(255,255,255,.45);
  --success:#15803D;--success-bg:#EEF7F0;--warning:#A16207;--warning-bg:#FBF3E2;--danger:#B42318;--danger-bg:#FBEDEB;--info:#2B6CB0;--info-bg:#EAF2FA;
  --sh:0 1px 2px rgba(16,16,16,.04),0 1px 3px rgba(16,16,16,.06);
  --sh2:0 2px 4px rgba(16,16,16,.03),0 6px 18px rgba(16,16,16,.07);
  --sh3:0 8px 24px rgba(16,16,16,.10),0 20px 48px rgba(16,16,16,.12);
  --r:10px;--rs:6px;--rl:14px;
  --ff:'Google Sans','DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--ff);background:var(--bg);color:var(--t1);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
input,select,textarea,button{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{font-weight:600;letter-spacing:-.01em}

/* rail */
.rail{position:fixed;left:0;top:0;bottom:0;width:68px;background:var(--sidebar);color:var(--sidebar-text);z-index:50;display:flex;flex-direction:column;padding:18px 12px;transition:width .22s var(--ease);overflow:hidden}
.rail:hover{width:224px;box-shadow:var(--sh3)}
.logo{display:flex;align-items:baseline;gap:6px;padding:4px 8px 22px;white-space:nowrap;cursor:pointer}
.logo b{font-size:20px;font-weight:700;letter-spacing:-.02em;color:#fff}
.logo span{font-size:11px;font-weight:600;letter-spacing:.18em;color:var(--sidebar-muted);opacity:0;transition:opacity .2s}
.rail:hover .logo span{opacity:1}
.nav{display:flex;flex-direction:column;gap:2px}
.ni{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:8px;color:var(--sidebar-muted);white-space:nowrap;border:none;background:none;text-align:left;width:100%;font-size:14px}
.ni i{width:20px;text-align:center;font-size:15px;flex:none}
.ni span{opacity:0;transition:opacity .15s}
.rail:hover .ni span{opacity:1}
.ni:hover{background:var(--sidebar-hover);color:#fff}
.ni.on{background:var(--sidebar-active);color:#fff}
.sync{margin-top:auto;display:flex;align-items:center;gap:14px;padding:10px 12px;font-size:12px;color:var(--sidebar-muted);white-space:nowrap}
.sync i{width:20px;text-align:center;font-size:14px;flex:none}
.sync span{opacity:0;transition:opacity .15s}.rail:hover .sync span{opacity:1}
.sync.ok i{color:#7BC48F}.sync.warn i{color:#E0B45C}.sync.err i{color:#E57A6E}

.shell{margin-left:68px;min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;background:rgba(247,245,240,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;gap:12px;min-height:64px}
.topbar h1{font-size:20px}
.topbar .sub{color:var(--t3);font-size:13px}
main{padding:24px 28px 80px;max-width:1440px}

/* primitives */
.card{background:var(--paper);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border-str);background:var(--paper);border-radius:8px;padding:7px 13px;font-size:13px;font-weight:500;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--paper-2);border-color:var(--t4)}
.btn.pri{background:var(--t1);border-color:var(--t1);color:#fff}

/* modal, toast, loader */

/* ---- scrubbing numbers: drag horizontally to change, click to type ---- */
let SCR = null;
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-scrub]'); if (!el || document.activeElement === el) return;
  SCR = { el, x: e.clientX, v: +el.value || 0, moved: false }; e.preventDefault();
});
document.addEventListener('pointermove', e => {
  if (!SCR) return; const dx = e.clientX - SCR.x;
  if (!SCR.moved && Math.abs(dx) < 3) return;
  SCR.moved = true; SCR.el.dataset.dragging = '1'; document.body.classList.add('scrubbing');
  const step = e.shiftKey ? 5 : 0.5, nv = Math.max(0, Math.round((SCR.v + Math.round(dx / 6) * step) * 2) / 2);
  if (+SCR.el.value !== nv) { SCR.el.value = nv; SCR.el.dispatchEvent(new Event('input', { bubbles: true })); }
});
document.addEventListener('pointerup', () => {
  if (!SCR) return; const { el, moved } = SCR; SCR = null; document.body.classList.remove('scrubbing'); delete el.dataset.dragging;
  if (!moved) { el.focus(); el.select(); } else el.dispatchEvent(new Event('change', { bubbles: true }));
});

      if (d.pa === 'skip') next();
      if (d.pa === 'save') {
        const phases = c.phases.filter(ph => ph.name.trim()).map(ph => ({ name: ph.name.trim(), cost: Math.round(+ph.fee || ph.lineSum || 0), items: ph.items.filter(i => i.name.trim()).map(i => ({ name: i.name.trim(), title: i.title || '', qty: i.qty, scope: i.scope, rate: i.rate, total: +i.total || 0, costRate: i.costRate, cost: i.cost ?? null, supplier: i.supplier || '', ext: !!i.ext })) }));
        const text = [p.name, ...phases.flatMap(ph => [ph.name, ...ph.items.map(i => i.name)])].join('\n');
        const rec = { id: p.id, name: p.name.trim() || 'Untitled', client: p.client || '', date: p.date || Date.now(), source: p.source || 'manual', file: p.file || '', method: c.method, sheet: c.sheet || '', total: Math.round(+c.total || 0), phases, text, itemHours: itemHoursMap(phases), detected: detect(text).map(x => x.id), off: !!p.off, fromScope: p.fromScope };
        const i = S.past.findIndex(x => x.id === rec.id); if (i >= 0) S.past[i] = rec; else S.past.push(rec);
        save(); toast(p._new ? 'Added to pricing model' : 'Saved'); next();
      }
    });
  });
}
function learnedRates() {
  const acc = {};
  inModel().forEach(p => pastLines(p).forEach(i => { if (i.scope !== 'hours' || !i.title || !(+i.rate > 0)) return; const a = acc[i.title] || (acc[i.title] = { r: [], c: [], h: 0, n: 0 }); a.r.push(+i.rate); if (+i.costRate > 0) a.c.push(+i.costRate); a.h += +i.qty || 0; a.n++; }));
  return Object.entries(acc).map(([t, a]) => ({ title: t, rate: median(a.r), cost: a.c.length ? median(a.c) : null, hours: a.h, n: a.n })).sort((a, b) => b.hours - a.hours);
}
function learnedActivities() {
  const acc = {};
  inModel().forEach(p => pastLines(p).forEach(i => { if (i.scope !== 'hours' || !(+i.qty > 0)) return; const k = normTxt(i.name) + '|' + (i.title || ''); const a = acc[k] || (acc[k] = { name: i.name, title: i.title, h: [] }); a.h.push(+i.qty); }));
  return Object.values(acc).map(a => ({ ...a, avg: a.h.reduce((x, y) => x + y, 0) / a.h.length, n: a.h.length })).sort((a, b) => b.n - a.n || b.avg - a.avg);
}

    if (['rate', 'costRate', 'price'].includes(key)) l[key] = v === '' ? null : +v; else l[key] = val;
    if (key === 'markup') l.price = null;
    touch(); if (key === 'personId') return render(); return updateTotals();
  }
  if (obj === 'set') { S.settings[key] = val; save(); if (key === 'agency') $('#agencyTag').textContent = v; return; }
  if (obj === 'person') {
    const p = S.people.find(x => x.id === d.id);
    if (key === 'title') {
      const old = p.title; p.title = v;
      if (old && v && !S.people.some(x => x !== p && x.title === old)) {
        S.library.forEach(L => Object.values(L.tracks).forEach(t => { if (t.title === old) t.title = v; }));
        S.templates.forEach(t => t.phases.forEach(ph => ph.items.forEach(it => it.lines.forEach(ln => { if (ln.title === old) ln.title = v; }))));
        if (S.settings.amTitle === old) S.settings.amTitle = v;
      }
    } else p[key] = (key === 'rate' || key === 'cost') ? +v || 0 : v;
    save(); return;
  }
  if (obj === 'lib') {
    const L = S.library.find(x => x.id === d.id);
    if (key === 'kw') L.kw = v.split(',').map(x => x.trim().toLowerCase()).filter(Boolean);
    else if (['base', 'per', 'title'].includes(key)) { const t = L.tracks[d.tr] || (L.tracks[d.tr] = { base: 0, per: 0, title: d.tr === 'copy' ? T.CW : T.DES }); t[key] = key === 'title' ? v : +v || 0; if (!t.base && !t.per && key !== 'title') delete L.tracks[d.tr]; }
    else L[key] = v;
    save(); return;
  }
  if (obj === 'ext') { const x = S.externals.find(e => e.id === d.id); if (key === 'kw') x.kw = v.split(',').map(y => y.trim().toLowerCase()).filter(Boolean); else x[key] = ['cost', 'markup'].includes(key) ? +v || 0 : v; save(); return; }
  if (obj === 'tpl') { const t = tpl(d.id); if (key === 'weeks') t.weeks[d.size] = +v || 1; else t[key] = v; save(); return; }
  const t = obj.startsWith('tpl') ? tpl(d.id) : null;
  if (obj === 'tplph') { t.phases[+d.pi].name = v; save(); return; }
  if (obj === 'tplit') { t.phases[+d.pi].items[+d.ii].name = v; save(); return; }
  if (obj === 'tplln') { const ln = t.phases[+d.pi].items[+d.ii].lines[+d.li]; if (key === 'hours') ln.hours[d.size] = +v || 0; else ln.title = v; save(); return; }
  if (obj === 'tplx') { const x = t.phases[+d.pi].ext[+d.xi]; if (key === 'cost') x.cost[d.size] = +v || 0; else x.name = v; save(); return; }
}
function setReview(el) {
  const rv = window._draft.review, d = el.dataset;
  if (d.rv) { rv[d.rv] = d.rv === 'weeks' ? Math.max(1, +el.value || 1) : el.value; if (d.rv === 'type' || d.rv === 'size') { rv.team = [...new Set([...rv.team, ...suggestTeam(rv.type, rv.size, rv.rows)])]; if (!/brief/i.test(rv.weeksSource || '')) rv.weeks = tpl(rv.type).weeks[rv.size]; render(); } return; }
  if (d.rvteam) { const id = d.rvteam; rv.team = el.checked ? [...rv.team, id] : rv.team.filter(x => x !== id); el.closest('.tp').classList.toggle('on', el.checked); return rvFooterUpdate(); }
  if (d.rvrow) {
    const r = rv.rows.find(x => x.id === d.rvrow), k = d.k;
    if (k === 'on') { r.on = el.checked; return render(); }
    if (k.startsWith('h_')) { r.hours[k.slice(2)] = +el.value || 0; r.auto = false; const hc = el.closest('.rv-it')?.querySelector('.hchip'); if (hc) hc.textContent = hrs(rvHours(r)); return rvFooterUpdate(); }
    if (k === 'qty') { r.qty = Math.max(1, +el.value || 1); if (r.auto && r.libId) { r.hours = libHours(lib(r.libId), r.qty); render(); } return; }
    if (k === 'libId') { r.libId = el.value || null; if (r.libId) { r.auto = true; r.hours = libHours(lib(r.libId), r.qty); } return render(); }
    r[k] = el.value; return;
  }
  if (d.rvext) { const x = rv.ext.find(y => y.id === d.rvext), k = d.k; if (k === 'on') { x.on = el.checked; return render(); } x[k] = ['cost', 'markup'].includes(k) ? +el.value || 0 : el.value; rvFooterUpdate(); }
}
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.f && el.dataset.f !== 'person.title') setField(el);
  if (el.hasAttribute('data-auto')) autosize(el);
  if (el.dataset.draft === 'client') { const h = $('#clientHint'); if (h) h.innerHTML = clientHint(el.value); }
  if (el.dataset.draft) { window._draft[el.dataset.draft] = el.value; if (el.dataset.draft === 'brief') { clearTimeout(window._lc); window._lc = setTimeout(liveChips, 300); } }
  if (el.dataset.rvrow && el.type !== 'checkbox' && el.tagName !== 'SELECT' && el.dataset.k !== 'qty') setReview(el);
  if (el.dataset.rvext && el.type !== 'checkbox' && el.tagName !== 'SELECT') setReview(el);

  if (el.hasAttribute('data-search')) { window._q = el.value; const pos = el.selectionStart; render(); const n = $('[data-search]'); n.focus(); n.setSelectionRange(pos, pos); }
});
document.addEventListener('change', async e => {
  const el = e.target, d = el.dataset;
  if (d.fc || d.f === 'person.title') setField(el);
  if (view === 'edit' && (d.f === 'line.hours' || d.f === 'itemh.hours' || d.f === 'grph.hours')) { const it = findItem(d.pid, d.iid); if (it && it.kind !== 'am' && it.kind !== 'wip') setTimeout(() => { addAM(cur()); touch(); render(); }, 0); }
  if (d.chgTog) { const [i, j] = d.chgTog.split(':').map(Number); const m = cur().chat[i]; m.changes[j].on = el.checked; touch(); renderAI(); }
  if (d.rv || d.rvteam || (d.rvrow && (el.type === 'checkbox' || el.tagName === 'SELECT' || d.k === 'qty')) || (d.rvext && (el.type === 'checkbox' || el.tagName === 'SELECT'))) setReview(el);
  if (d.settog) { S.settings[d.settog] = el.checked; save(); }

  if (d.chg === 'additem' && el.value) { addLineTo(findPhase(d.pid), el.value); touch(); render(); }

    else if (el.value) { const cl = client(el.value); s.clientId = cl.id; s.client = cl.name; touch(); render(); }
  }
  if (el.hasAttribute('data-rangetog')) { const s = cur(); histMark(); s.range = { lo: 10, hi: 15, ...(s.range || {}), on: el.checked }; touch(); render(); toast(el.checked ? 'Quoting as a range' : 'Back to a fixed price'); }
  if (d.chg === 'filter') { UI.filter = el.value; saveUI(); render(); }
  if (d.chg === 'teamadd' && el.value) { cur().team.push(el.value); touch(); render(); }
  if (el.hasAttribute('data-applycal')) { window._draft.applyCal = el.checked; rvFooterUpdate(); }
  if (el.hasAttribute('data-aitog')) { S.settings.ai = el.checked; save(); }
  if (el.hasAttribute('data-briefup') && el.files[0]) {
    try { const txt = await fileText(el.files[0]); window._draft.brief = (window._draft.brief ? window._draft.brief + '\n\n' : '') + txt.trim(); if (!window._draft.name) window._draft.name = el.files[0].name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' '); render(); toast('Brief loaded'); }
    catch (err) { toast('Could not read that file'); }
  }
  if (el.hasAttribute('data-logoup') && el.files[0]) {
    const f = el.files[0]; if (f.size > 400000) return toast('Logo must be under 400 KB');
    const rd = new FileReader(); rd.onload = () => { S.settings.logo = rd.result; save(); render(); toast('Logo updated'); }; rd.readAsDataURL(f);
  }

    try { const n = normalize(JSON.parse(await el.files[0].text())); if (!n.people || !n.scopes) throw 0; n.settings.apiKey = S.settings.apiKey; S = n; save(); render(); toast('Backup imported'); } catch (err) { toast('Not a valid backup'); }
  }
});
async function handlePast(files) {
  if (!files.length) return;
  const done = loader('Reading scopes…'), out = [];
  for (const f of files) { try { const p = await importFile(f); p._new = true; out.push(p); } catch (e) { toast('Couldn\'t read ' + f.name); } }
  done(); if (out.length) pastModal(out[0], out.slice(1));
}
